<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusXplore | Interactive 2D Map & 360° Virtual Tour</title>
    <meta name="description" content="Explore SCET Campus in immersive 360° virtual reality with real-time bidirectional 2D map synchronization, orientation radar, and department directories.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/home.svg">

    <!-- Pannellum 360 Viewer CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

    <!-- Modern Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main 360 Viewport -->
    <main id="panorama-container">
        <div id="panorama"></div>
    </main>

    <!-- Header Navigation -->
    <header id="tour-header">
        <div class="header-brand">
            <div class="header-brand-icon">CX</div>
            <div class="brand-text">
                <h1>CampusXplore</h1>
                <span>SCET Interactive Virtual Tour</span>
            </div>
        </div>

        <div class="header-center-info">
            <div class="location-chip">
                <span>📍</span>
                <span id="current-location-name">Main Administrative Entrance</span>
            </div>
            <span class="floor-badge" id="current-floor-badge">Ground Floor</span>
        </div>

        <div class="header-actions">
            <button class="btn-icon" id="audio-toggle-btn" title="Toggle Voice Narration">
                <img src="assets/icons/sound-off.svg" alt="Audio narration toggle">
            </button>

            <button class="btn-primary-pill" id="reset-tour-btn">
                <img src="assets/icons/reset.svg" alt="Reset" style="width: 14px; height: 14px; filter: invert(1);">
                <span>Reset Tour</span>
            </button>
        </div>
    </header>

    <!-- Search & Quick Navigation Bar -->
    <aside id="scene-search-bar">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="scene-search-input" placeholder="Search departments, labs, landmarks..." autocomplete="off">
        </div>

        <div class="category-filter-chips">
            <button class="filter-chip active" data-category="all">All</button>
            <button class="filter-chip" data-category="department">Departments</button>
            <button class="filter-chip" data-category="landmark">Landmarks</button>
            <button class="filter-chip" data-category="pathway">Paths & Gates</button>
        </div>

        <div id="scene-dropdown-list">
            <!-- Populated dynamically by main.js -->
        </div>
    </aside>

    <!-- Compass Widget -->
    <div id="compass-widget" title="Click to align view north">
        <img id="compass-needle" src="assets/icons/compass.svg" alt="Compass Needle">
    </div>

    <!-- Interactive Floating 2D Map with Real-Time Radar Cone -->
    <section id="map-block">
        <div id="map-header">
            <div class="map-header-title">
                <img src="assets/icons/map.svg" alt="Map icon" style="width: 16px; height: 16px; filter: invert(0.8);">
                <span>2D Campus Map</span>
            </div>
            <div class="map-controls-group">
                <button class="map-btn-tiny" id="map-toggle-minimize" title="Minimize / Expand Map">−</button>
            </div>
        </div>

        <div id="map-floor-bar">
            <button class="floor-tab-btn active" data-floor="all">All Levels</button>
            <button class="floor-tab-btn" data-floor="Ground Floor">Ground</button>
            <button class="floor-tab-btn" data-floor="Floor 1">Floor 1</button>
        </div>

        <div id="map-wrapper">
            <!-- 2D Floor Plan -->
            <img src="assets/maps/scet-first-floor.jpg" 
                 alt="SCET Campus Map" 
                 id="campusMapImage">

            <!-- Interactive Clickable Pins Layer -->
            <div id="map-pins-layer"></div>

            <!-- Active User Position Pin with FOV Radar Cone -->
            <div id="map-pointer">
                <div id="map-pointer-ring"></div>
                <div id="radar-cone" title="Viewing Orientation FOV"></div>
            </div>
        </div>

        <!-- Button to expand map when minimized -->
        <button class="map-expand-btn" id="map-expand-btn" title="Open Map">
            <img src="assets/icons/map.svg" alt="Expand map" style="width: 22px; height: 22px; filter: invert(1);">
        </button>
    </section>

    <!-- Hotspot Information Modal / Flashcard -->
    <div id="info-modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3 id="modal-title">Location Information</h3>
            <button class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">×</button>
        </div>
        <div id="modal-body">
            <!-- Dynamic info content injected by main.js -->
        </div>
    </div>

    <!-- Pannellum 360 Viewer JS -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Application Modules -->
    <script src="js/viewer.js"></script>
    <script src="js/mapSync.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
